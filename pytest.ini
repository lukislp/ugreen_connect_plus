[pytest]
testpaths = tests

# The Home Assistant tests are async and pytest-homeassistant-custom-component
# expects to be trusted with them; strict mode leaves its own fixtures
# unhandled.
asyncio_mode = auto

# The Home Assistant tests import the integration as `custom_components....`,
# which only works if the repository root is on the import path. Running them
# as `python -m pytest` puts it there by accident -- a bare `pytest`, which is
# what CI runs, does not. Saying so here makes the two agree.
pythonpath = .

# The suite loads protocol.py and session.py directly, with no Home Assistant
# anywhere near it -- that is the whole reason those two modules are free of it.
# pytest-homeassistant-custom-component is not a dependency of this repository,
# but it is one of other custom-component checkouts, and a single environment
# shared with one of those is enough: its plugin takes over the event loop
# policy and blocks sockets for every test collected, and all 55 error out
# before a line of ours runs. Naming it here keeps whether the suite passes a
# property of this repository rather than of what else the machine happens to
# have installed. Harmless where the plugin is absent, which is what CI is.
addopts = -p no:homeassistant
