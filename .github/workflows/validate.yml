name: Validate

on:
  push:
  pull_request:
  schedule:
    # Both checks track moving targets, so a green build today can rot quietly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # The check reads the repository through the API and cannot see a private
    # one -- a token does not help. It reports that as an invalid hacs.json and
    # a manifest it could not find, which sends people looking for a fault in
    # files that are fine: the identical files pass upstream, in public. So it
    # is skipped while this is private, and comes back by itself if it opens.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration

  tests:
    name: Session logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # `session.py` carries no Home Assistant imports precisely so its rules can be
      # exercised without installing one; the tests load it straight from its file and
      # fail loudly if that ever stops being true.
      - run: pip install pytest
      - run: pytest tests -q
