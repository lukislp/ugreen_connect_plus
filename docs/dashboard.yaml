# The view in docs/dashboard.png, as one screenful in four columns.
#
# Built from cards Home Assistant ships with; nothing else has to be installed.
#
# TO USE: paste under `views:` in a dashboard's raw configuration editor, then
#   - replace ugreen_nexode_pro_x783 with your charger's own entity prefix, and
#   - replace the device_id under the screensaver card with your charger's
#     (Settings -> Devices -> your charger; it is the last part of the URL).

title: UGREEN Nexode Pro 300W
path: charger
type: sections
max_columns: 4
dense_section_placement: true
sections:
- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Power
    icon: mdi:lightning-bolt
    heading_style: title
  - type: gauge
    entity: sensor.ugreen_nexode_pro_x783_total_power
    name: Total power
    unit: W
    min: 0
    max: 300
    needle: true
    severity:
      green: 0
      yellow: 150
      red: 250
  - type: tile
    entity: select.ugreen_nexode_pro_x783_charging_mode
    name: Mode
    icon: mdi:ev-station
  - type: tile
    entity: sensor.ugreen_nexode_pro_x783_cloud_status
    name: Cloud
    icon: mdi:cloud-check-variant
  - type: heading
    heading: Screen
    icon: mdi:monitor
    heading_style: title
  - type: tile
    entity: number.ugreen_nexode_pro_x783_screen_brightness
    name: Brightness
    icon: mdi:brightness-6
    features:
    - type: numeric-input
      style: slider
  - type: tile
    entity: select.ugreen_nexode_pro_x783_screen_off_time
    name: Screen off
    icon: mdi:monitor-off
  - type: heading
    heading: Device
    icon: mdi:information-outline
    heading_style: title
  - type: tile
    entity: update.ugreen_nexode_pro_x783_firmware
    name: Firmware
    icon: mdi:chip
  - type: markdown
    text_only: true
    content: '**Firmware** {{ state_attr(''sensor.ugreen_nexode_pro_x783_total_power'',''firmware'') }}
      · **Wi-Fi** {{ state_attr(''sensor.ugreen_nexode_pro_x783_total_power'',''ssid'') }}


      **MAC** `{{ state_attr(''sensor.ugreen_nexode_pro_x783_cloud_status'',''mac'') }}`'
- type: grid
  column_span: 1
  cards:
  - type: custom:ugreen-plus-wallpaper-card
    device_id: 0123456789abcdef0123456789abcdef
    title: Screensaver
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Ports
    icon: mdi:usb-port
    heading_style: title
  - type: grid
    columns: 4
    square: false
    grid_options:
      columns: full
    cards:
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c1_power
      name: C1
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c2_power
      name: C2
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c3_power
      name: C3
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c4_power
      name: C4
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c5_power
      name: C5
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c6_power
      name: C6
      icon: mdi:usb-c-port
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_a1_power
      name: A1
      icon: mdi:usb-port
      color: blue
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_dc_power
      name: DC
      icon: mdi:current-dc
      color: blue
      vertical: true
      tap_action:
        action: more-info
  - type: heading
    heading: Power history
    icon: mdi:chart-line
    heading_style: title
  - type: history-graph
    hours_to_show: 3
    grid_options:
      columns: full
    entities:
    - entity: sensor.ugreen_nexode_pro_x783_total_power
      name: Total
    - entity: sensor.ugreen_nexode_pro_x783_c1_power
      name: C1
    - entity: sensor.ugreen_nexode_pro_x783_c2_power
      name: C2
    - entity: sensor.ugreen_nexode_pro_x783_c3_power
      name: C3
    - entity: sensor.ugreen_nexode_pro_x783_c4_power
      name: C4
    - entity: sensor.ugreen_nexode_pro_x783_c5_power
      name: C5
    - entity: sensor.ugreen_nexode_pro_x783_c6_power
      name: C6
    - entity: sensor.ugreen_nexode_pro_x783_a1_power
      name: A1

- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Charging
    icon: mdi:battery-charging
    heading_style: title
  - type: grid
    columns: 4
    square: false
    grid_options:
      columns: full
    cards:
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c1_charging
      name: C1
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c2_charging
      name: C2
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c3_charging
      name: C3
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c4_charging
      name: C4
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c5_charging
      name: C5
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_c6_charging
      name: C6
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_a1_charging
      name: A1
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.ugreen_nexode_pro_x783_dc_charging
      name: DC
      icon: mdi:battery-charging-outline
      color: green
      vertical: true
      tap_action:
        action: more-info

- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Energy
    icon: mdi:lightning-bolt-circle
    heading_style: title
  - type: tile
    entity: sensor.ugreen_nexode_pro_x783_total_energy
    name: Charger, all time
    icon: mdi:counter
    color: amber
    tap_action:
      action: more-info
  - type: grid
    columns: 4
    square: false
    grid_options:
      columns: full
    cards:
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c1_total_energy
      name: C1
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c2_total_energy
      name: C2
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c3_total_energy
      name: C3
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c4_total_energy
      name: C4
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c5_total_energy
      name: C5
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c6_total_energy
      name: C6
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_a1_total_energy
      name: A1
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_dc_total_energy
      name: DC
      icon: mdi:counter
      color: amber
      vertical: true
      tap_action:
        action: more-info

- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Port allocation
    icon: mdi:tune-variant
    heading_style: title
  - type: tile
    entity: sensor.ugreen_nexode_pro_x783_custom_mode
    name: Mode in the app
    icon: mdi:tune-variant
    tap_action:
      action: more-info
  - type: grid
    columns: 3
    square: false
    grid_options:
      columns: full
    cards:
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c1_custom_limit
      name: C1
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c2_custom_limit
      name: C2
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c3_custom_limit
      name: C3
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c4_custom_limit
      name: C4
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c5_custom_limit
      name: C5
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
    - type: tile
      entity: sensor.ugreen_nexode_pro_x783_c6_custom_limit_shared_with_a1
      name: C6+A
      icon: mdi:speedometer
      color: purple
      vertical: true
      tap_action:
        action: more-info
  - type: markdown
    content: >-
      Only while the charger is running its custom mode; a preset leaves these
      unavailable. Each tile's attributes carry the protocols that port may
      negotiate.

- type: grid
  column_span: 1
  cards:
  - type: heading
    heading: Diagnostics
    icon: mdi:stethoscope
    heading_style: title
  - type: tile
    entity: sensor.ugreen_nexode_pro_x783_last_successful_poll
    name: Last reading
    icon: mdi:clock-check-outline
    tap_action:
      action: more-info
  - type: tile
    entity: sensor.ugreen_nexode_pro_x783_wi_fi_network
    name: Wi-Fi
    icon: mdi:wifi
    tap_action:
      action: more-info
